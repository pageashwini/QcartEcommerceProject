extent.reporter.spark.start=true
extent.reporter.json.start=true
extent.reporter.pdf.start=true

extent.reporter.spark.config = src/test/resources/extent-config.xml
extent.reporter.spark.out = test-output/SparkReport/ExtentSpark.html

extent.reporter.pdf.config =src/test/resources/pdf-config.xml
extent.reporter.pdf.out = test-output/PdfReport/ExtentPdf.pdf
extent.reporter.json.out = test-output/JsonReport/ExtentJson.pdf


extent.reporter.spark.vieworder = dashboard.test,category,exception,author,devide,log
screenshot.dir = test-output/FailedTestScreenshots/
screenshot.rel.path=../FailedTestScreenshots/
syseminfo.build=Sprint-1